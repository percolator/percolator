name: Wheels

# Builds the binaries-only Python wheels (pyproject.toml) with cibuildwheel
# and the source distribution, tests each wheel (admin/wheels/check_wheel.py)
# and uploads them as artifacts.
#
# Uploads to PyPI are started by hand, as the container image is: Actions,
# Wheels, Run workflow, "Use workflow from" a release tag (e.g. rel-4-00),
# publish ticked; or gh workflow run wheels.yml --ref rel-4-00 -f publish=true.
# The job publish then uploads the five wheels and the source distribution to
# PyPI as percolator-cpp (pyproject.toml), if their version is that of the
# tag. A run uses the workflow file of its tag, so the tag must be on a commit
# that has this file and, in CommonCMake.txt, the tag's version; the tags up
# to rel-3-09-01 have neither.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to PyPI (only from a tag rel-X-YY or rel-X-YY-ZZ whose version is that of CommonCMake.txt)
        type: boolean
        default: false
  pull_request:
    paths:
      - pyproject.toml
      - python/**
      - admin/wheels/**
      - .github/workflows/wheels.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel:
    name: wheel-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: build_and_test
      # one py3-none-<platform> wheel; the test command runs the installed
      # percolator and qvality commands
      uses: pypa/cibuildwheel@v3.2.1
      with:
        output-dir: wheelhouse
    - name: check_contents
      shell: bash
      run: |
        python=$(command -v python || command -v python3)
        "$python" admin/wheels/check_wheel.py --wheel wheelhouse/*.whl
    - name: check_macos_binaries
      # minos 12.0, and no Homebrew library (libomp is linked statically)
      if: runner.os == 'macOS'
      run: |
        unzip -q wheelhouse/*.whl -d unpacked
        for bin in unpacked/percolator_launcher/bin/percolator unpacked/percolator_launcher/bin/qvality; do
          lipo -info "$bin"
          libs=$(otool -L "$bin")
          echo "$libs"
          minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ {f = 1} f && $1 == "minos" && !done {print $2; done = 1}')
          echo "minos $minos"
          test "$minos" = "12.0"
          if grep -q -e libomp -e /opt/homebrew -e /usr/local <<< "$libs"; then
            echo "$bin needs a library that the wheel does not hold"
            exit 1
          fi
        done
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.platform }}
        path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: build
      run: pipx run build --sdist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  # Uploads the five wheels and the source distribution to PyPI when the
  # workflow is run by hand with publish ticked. PyPI accepts the upload by
  # trusted publishing (OpenID Connect): the project percolator-cpp names this
  # repository and this workflow as its publisher, so no token is stored. The
  # version comes from CommonCMake.txt ("3.09.0" becomes 3.9.0) and must be
  # that of the tag the workflow runs on (rel-3-09-01 is 3.9.1). PyPI refuses
  # a version it already holds, so the version is raised before a release.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'percolator/percolator'
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/percolator-cpp/
    permissions:
      id-token: write
    steps:
    # both actions of this job are pinned to a commit, since the job can
    # obtain a PyPI token
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: dist
        merge-multiple: true
    - name: check
      # a tag rel-X-YY or rel-X-YY-ZZ, and five wheels and one source
      # distribution of its version and nothing else, or nothing is uploaded
      shell: bash
      run: |
        ls -l dist
        if [[ ! "$GITHUB_REF" =~ ^refs/tags/rel-([0-9]{1,9})-([0-9]{1,9})(-([0-9]{1,9}))?$ ]]; then
          echo "::error::publish runs on a tag rel-X-YY or rel-X-YY-ZZ, not on $GITHUB_REF"
          exit 1
        fi
        version=$((10#${BASH_REMATCH[1]})).$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[4]:-0}))
        wheels=0
        sdists=0
        for f in dist/*; do
          case "${f#dist/}" in
            "percolator_cpp-$version-py3-none-"*.whl) wheels=$((wheels + 1)) ;;
            "percolator_cpp-$version.tar.gz") sdists=$((sdists + 1)) ;;
            *) echo "::error::${f#dist/} is not a file of version $version (tag ${GITHUB_REF#refs/tags/})"; exit 1 ;;
          esac
        done
        if [ "$wheels" -ne 5 ] || [ "$sdists" -ne 1 ]; then
          echo "::error::$wheels wheels and $sdists source distributions of version $version; expected 5 and 1"
          exit 1
        fi
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
