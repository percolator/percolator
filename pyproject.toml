# The Python wheel of Percolator: the percolator and qvality executables of
# the CMake build, nothing else. "pip install" puts two commands of the same
# names on the PATH, which start the bundled binaries
# (python/percolator_launcher). There is no Python API.
#
# Build one wheel for this machine:  python -m build --wheel
# Build the release wheels:          .github/workflows/wheels.yml (cibuildwheel)

[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
# PLACEHOLDER, to be decided before the first upload: "percolator" on PyPI
# belongs to an unrelated project. This line is the only place that holds
# the distribution name; the import package (percolator_launcher) and the
# commands do not depend on it.
name = "percolator-bin"
dynamic = ["version"]
description = "Percolator and qvality: semi-supervised learning for peptide identification from shotgun proteomics data (command line programs)"
readme = "ReadMe.md"
license = "Apache-2.0"
license-files = ["license.txt"]
requires-python = ">=3.8"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "http://percolator.ms"
Source = "https://github.com/percolator/percolator"

[project.scripts]
percolator = "percolator_launcher:percolator"
qvality = "percolator_launcher:qvality"

# The version has one source, the three numbers in CommonCMake.txt that
# CMake and CPack use. Python normalises "3.09.0" to "3.9.0".
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CommonCMake.txt"
regex = '''set\(CPACK_PACKAGE_VERSION_MAJOR "(?P<major>[0-9]+)"\)\s+set\(CPACK_PACKAGE_VERSION_MINOR "(?P<minor>[0-9]+)"\)\s+set\(CPACK_PACKAGE_VERSION_PATCH "(?P<patch>[0-9]+)"\)'''
result = "{major}.{minor}.{patch}"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
cmake.build-type = "Release"
# one wheel per platform for every Python 3: it holds no extension module
wheel.py-api = "py3"
wheel.packages = ["python/percolator_launcher"]
# CMake installs into <package>/bin: the executables and, with MSVC,
# vcomp140.dll (OpenMP) and the other redistributable DLLs beside them
wheel.install-dir = "percolator_launcher"
install.strip = true
sdist.exclude = [".github", "admin/vagrant", "data", "doc", "docs", "tests"]

[tool.scikit-build.cmake.define]
# no unit or system tests in the wheel build (no GoogleTest download)
NO_TESTS = "ON"
# Linux: link libgomp statically where libgomp.a exists; macOS and Windows
# default to ON
STATIC = "ON"

[tool.cibuildwheel]
# the wheel is the same for every Python version, so build with one
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-command = "python {project}/admin/wheels/check_wheel.py --installed {project}/data/percolator/tab/percolatorTab"

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["native"]
# NOT TRIED: no macOS machine was available when this was written.
# libomp built for the deployment target and linked statically (Homebrew's
# libomp is built for the macOS version of the build machine)
before-all = "bash {project}/admin/wheels/build_libomp_macos.sh /tmp/percolator-libomp"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "12.0"
CMAKE_ARGS = "-DOpenMP_CXX_FLAGS='-Xpreprocessor -fopenmp -I/tmp/percolator-libomp/include' -DOpenMP_CXX_LIB_NAMES=omp -DOpenMP_omp_LIBRARY=/tmp/percolator-libomp/lib/libomp.a"

# NOT TRIED: no Windows machine was available when this was written. CMake
# installs vcomp140.dll (CMAKE_INSTALL_OPENMP_LIBRARIES in CMakeLists.txt),
# and the test command fails if it is not beside the executables.
[tool.cibuildwheel.windows]
archs = ["AMD64"]
